(function () {
  var d = document.documentElement;
  var video = document.querySelector(".hero__photo video");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (reduce) {
    if (video) {
      video.removeAttribute("autoplay");
      video.autoplay = false;
      video.pause();
    }
    return;
  }
  if (!d.classList.contains("is-entering")) return;

  var started = false;
  var finished = false;

  function finish() {
    if (finished) return;
    finished = true;
    d.classList.remove("is-entering", "is-playing");
    clearTimeout(window.__auFailsafe);
  }

  function play() {
    if (started) return;
    started = true;

        : [];
      Promise.all(anims.map(function (a) {
        return a.finished.catch(function () {});
      })).then(finish);
      setTimeout(finish, 2200);
    });
  }

  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 1em "AU Grotesk"'),
      document.fonts.load('700 1em "AU Grotesk"')
    ]).then(function () { return document.fonts.ready; }).then(play, play);
  }
  setTimeout(play, 1200);
})();
</script>
</body>
</html>
